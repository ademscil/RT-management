version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: simrt_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-simrt_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SimRT2026SecurePiiVault!}
      POSTGRES_DB: ${DB_NAME:-simrt_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres-init/01-init-rls.sql:/docker-entrypoint-initdb.d/01-init-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-simrt_admin} -d ${DB_NAME:-simrt_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simrt_prod_net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: simrt_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-simrt_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-SimRTMinioSecureSecret2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    networks:
      - simrt_prod_net

  backend-api:
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    container_name: simrt_backend_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-simrt_admin}:${DB_PASSWORD:-SimRT2026SecurePiiVault!}@postgres:5432/${DB_NAME:-simrt_production}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PII_MASTER_KEY_HEX: ${PII_MASTER_KEY_HEX}
      PII_CURRENT_KEY_VERSION: ${PII_CURRENT_KEY_VERSION:-v1}
      BLIND_INDEX_PEPPER: ${BLIND_INDEX_PEPPER}
      ED25519_PRIVATE_KEY_HEX: ${ED25519_PRIVATE_KEY_HEX}
      ED25519_PUBLIC_KEY_HEX: ${ED25519_PUBLIC_KEY_HEX}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-simrt_minio_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-SimRTMinioSecureSecret2026!}
      S3_BUCKET_DOKUMEN_WARGA: dokumen-warga
      S3_BUCKET_KAS_NOTA: kas-nota
      S3_BUCKET_SURAT_ARSIP: surat-arsip
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - simrt_prod_net

  caddy:
    image: caddy:2-alpine
    container_name: simrt_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/admin-panel/dist:/srv/admin-panel:ro
      - ./apps/resident-mobile/dist:/srv/resident-mobile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend-api
    networks:
      - simrt_prod_net

networks:
  simrt_prod_net:
    driver: bridge

volumes:
  postgres_prod_data:
  minio_prod_data:
  caddy_data:
  caddy_config:
